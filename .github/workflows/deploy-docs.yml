name: Deploy docs to GitHub Pages

# Manual-only: docs publish when you run this workflow from the Actions
# tab (or via `gh workflow run deploy-docs.yml`). No push trigger, so
# committing docs/ changes does not auto-publish.
#
# Pages is auto-enabled on first run via `enablement: true` on
# actions/configure-pages, so no UI setup is required - just run the
# workflow once and Pages turns itself on.
#
# Site lives at: https://mysticmind.github.io/agentskills-cli/

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy (defaults to the branch you ran it from)'
        required: false
        type: string

# Allow this workflow to publish to Pages and request the deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time; new manual runs supersede
# in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # full history so VitePress' lastUpdated timestamps work

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Disable Jekyll on the published artifact
        run: touch docs/.vitepress/dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          # Bootstrap Pages on first run if not yet enabled in repo Settings.
          # Subsequent runs are no-ops for this flag.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
